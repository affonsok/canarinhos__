version: "3.8"

services:
  canarinhos:
    build: .
    container_name: canarinhos-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-file:/app/prisma/dev.db}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-canarinhos-prod-secret-change-this}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://ensaio.campolabs.com.br}
      - AUTO_SEED=${AUTO_SEED:-true}
    volumes:
      - prisma-data:/app/prisma

volumes:
  prisma-data:
